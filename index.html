<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cisama | Tienda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  position:relative;
  background:#071426;
}

/* Imagen de fondo */
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:url('templates/assets/fondo-admin.jpg') center/cover no-repeat;
  z-index:-2;
  filter:brightness(.55) saturate(1.1);
}
/* Capa oscura encima */
body:after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, #1455a555 0%, transparent 55%),
    radial-gradient(circle at 80% 80%, #0a7cff44 0%, transparent 55%),
    linear-gradient(180deg, #071426aa 0%, #071426dd 100%);
  z-index:-1;
}

header{
  height:85px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #ffffff15;
  background:#071426cc;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:100;
}
.logo img{width:180px;height:auto;object-fit:contain}
nav{display:flex;gap:30px}
nav a{color:#aebbd0;text-decoration:none;font-size:14px;transition:.3s;cursor:pointer}
nav a:hover,nav a.active{color:white}
nav a.active{position:relative}
nav a.active:after{content:"";position:absolute;bottom:-32px;left:0;width:100%;height:2px;background:#438eea}
.actions{display:flex;align-items:center;gap:22px}
.actions button{background:transparent;border:0;color:white;font-size:18px;cursor:pointer;transition:.3s;position:relative}
.actions button:hover{color:#438eea}
.cart-count{position:absolute;top:-10px;right:-12px;background:#2476d9;color:white;border-radius:50%;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center}
.page{display:none}
.page.active{display:block}

/* INICIO */
.hero{min-height:calc(100vh - 85px);padding:60px 9%;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:550px;height:550px;background:#1455a5;filter:blur(160px);opacity:.25;right:5%;top:10%}
.content{position:relative;z-index:2;max-width:520px}
h1{font-size:clamp(48px,7vw,90px);line-height:.98;font-weight:900;letter-spacing:-4px}
h1 span{color:#438eea}
.description{color:#9baac0;font-size:15px;line-height:1.8;margin:28px 0;max-width:390px}
.buttons{display:flex;gap:15px;align-items:center}
.primary{background:#2476d9;color:white;padding:16px 28px;border:0;border-radius:6px;font-weight:bold;cursor:pointer;transition:.3s}
.primary:hover{background:#4397ff;transform:translateY(-3px)}
.secondary{background:#071426aa;color:white;border:1px solid #ffffff40;padding:15px 25px;border-radius:6px;cursor:pointer;backdrop-filter:blur(8px)}
.product{position:relative;z-index:2;width:55%;display:flex;justify-content:center;align-items:center}
.product img{width:125%;max-width:850px;object-fit:contain;filter:drop-shadow(0 35px 35px #0009);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-18px) rotate(-2deg)}}

/* TIENDA */
.store{padding:55px 7%;min-height:calc(100vh - 85px)}

/* HEADING + TOOLS en la misma fila */
.store-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:24px;
  margin-bottom:32px;
  flex-wrap:wrap;
  padding-bottom:24px;
  border-bottom:1px solid #1c3552;
}
.store-heading h2{font-size:36px;font-weight:800;letter-spacing:-1px}
.store-heading h2 span{color:#438eea}
.store-heading p{color:#899bb5;font-size:14px;margin-top:9px}

/* TOOLS a la derecha */
.store-tools{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;
}
.search-box{
  position:relative;
  width:280px;
  max-width:100%;
}
.search-box i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#7f93ad;
  font-size:13px;
  pointer-events:none;
  transition:color .25s;
}
.search-box input{
  width:100%;
  height:42px;
  background:#0b1b30cc;
  border:1px solid #1f3a5a;
  border-radius:9px;
  color:white;
  padding:0 14px 0 38px;
  outline:none;
  font-size:13px;
  transition:.25s;
  backdrop-filter:blur(8px);
}
.search-box input:focus{
  border-color:#438eea;
  background:#0d2038e6;
  box-shadow:0 0 0 3px #438eea20;
}
.search-box:focus-within i{color:#438eea}
.search-box input::placeholder{color:#6f849e}

.store-tools select{
  height:42px;
  background:#0b1b30cc;
  border:1px solid #1f3a5a;
  border-radius:9px;
  color:#dce8f8;
  padding:0 34px 0 13px;
  outline:none;
  min-width:170px;
  cursor:pointer;
  font-size:13px;
  transition:.25s;
  appearance:none;
  -webkit-appearance:none;
  backdrop-filter:blur(8px);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%237f93ad' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;
  background-position:right 13px center;
}
.store-tools select:hover{border-color:#2a4a6e;background-color:#0d2038e6}
.store-tools select:focus{
  border-color:#438eea;
  background-color:#0d2038e6;
  box-shadow:0 0 0 3px #438eea20;
}
.store-tools select option{background:#0b1b30;color:#dce8f8}

/* TARJETAS */
.products-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;align-items:start}
.product-card{
  background:linear-gradient(145deg,#10243ddd,#0b192cdd);
  border:1px solid #1c3552;
  border-radius:12px;
  overflow:hidden;
  transition:all .3s;
  position:relative;
  min-width:0;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.product-card:hover{transform:translateY(-5px);border-color:#438eea;box-shadow:0 12px 30px #0005}
.product-image{height:165px;background:linear-gradient(145deg,#172f4ccc,#10243bcc);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:12px}
.product-image:after{content:"";position:absolute;width:120px;height:120px;background:#438eea;filter:blur(65px);opacity:.12;pointer-events:none}
.product-image img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1;transition:transform .4s}
.product-card:hover .product-image img{transform:scale(1.08)}
.product-info{padding:14px}
.product-info h3{font-size:15px;font-weight:700;color:#f1f6ff;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-description{font-size:11px;color:#8fa3bd;line-height:1.5;height:33px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.product-footer{display:flex;justify-content:space-between;align-items:center;margin-top:13px;gap:8px}
.product-price{font-size:17px;font-weight:800;color:#70b4ff;white-space:nowrap;display:flex;align-items:center;gap:7px}
.product-price i{font-size:14px;color:#438eea}
.product-quantity{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid #ffffff10;font-size:11px;color:#91a9c5}
.product-quantity i{color:#65cf9a;font-size:12px}
.product-quantity strong{color:#65cf9a;font-weight:700}
.product-quantity.out,.product-quantity.out i,.product-quantity.out strong{color:#ff8585}
.add-cart{background:#2476d9;color:white;border:0;border-radius:8px;width:35px;height:35px;flex-shrink:0;cursor:pointer;font-size:13px;transition:.3s}
.add-cart:hover{background:#4397ff;transform:scale(1.07)}
.add-cart:disabled{background:#34465d;color:#899bb5;cursor:not-allowed;transform:none}
.loading,.empty,.error{grid-column:1/-1;text-align:center;padding:65px 15px;color:#8da1bb}
.loading i{font-size:28px;color:#438eea;margin-bottom:15px}
.empty i,.error i{font-size:35px;display:block;margin-bottom:15px;color:#438eea}
.toast{position:fixed;bottom:25px;right:25px;background:#153354e6;border:1px solid #438eea;padding:15px 22px;border-radius:9px;color:white;z-index:300;transform:translateY(100px);opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 25px #0005;backdrop-filter:blur(10px)}
.toast.show{transform:translateY(0);opacity:1}

/* RESPONSIVE */
@media(max-width:1100px){
.products-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
header{padding:0 4%}
nav{gap:18px}
}
@media(max-width:750px){
header{padding:0 5%;height:75px}
.logo img{width:115px}
nav{gap:12px}
nav a{font-size:11px}
nav a i{display:none}
nav a.active:after{bottom:-30px}
.actions{gap:12px}
.actions button{font-size:16px}
.hero{padding:55px 7%;flex-direction:column;justify-content:center;align-items:flex-start;gap:30px}
.content{max-width:100%}
h1{font-size:58px}
.product{width:100%;max-height:380px}
.product img{width:120%;max-height:380px}
.store{padding:40px 5%}
.store-head{flex-direction:column;align-items:stretch;gap:18px}
.store-heading h2{font-size:30px}
.store-tools{justify-content:flex-start;width:100%}
.search-box{width:100%}
.store-tools select{width:100%;min-width:0}
.products-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.product-image{height:155px}
.product-info{padding:12px}
.product-info h3{font-size:13px}
.product-price{font-size:16px}
}
@media(max-width:430px){
header{padding:0 3%}
.logo img{width:90px}
nav{gap:9px}
nav a{font-size:10px}
.actions{gap:9px}
.actions button{font-size:14px}
.products-grid{gap:10px}
.product-image{height:130px;padding:9px}
.product-info{padding:10px}
.product-info h3{font-size:12px}
.product-description{font-size:10px;height:30px}
.product-price{font-size:14px}
.product-price i{font-size:12px}
.add-cart{width:32px;height:32px}
.product-footer{margin-top:10px}
.product-quantity{font-size:10px;margin-top:8px;padding-top:8px}
.store-heading h2{font-size:26px}
.store-heading p{font-size:12px}
.search-box input{height:40px;font-size:12px}
.store-tools select{height:40px;font-size:12px}
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="templates/assets/logo.png" alt="Cisama">
  </div>

  <nav>
    <a class="active" data-page="inicio"><i class="fa-solid fa-house"></i> Inicio</a>
    <a data-page="tienda"><i class="fa-solid fa-store"></i> Tienda</a>
    <a href="#"><i class="fa-solid fa-layer-group"></i> Colección</a>
    <a href="#"><i class="fa-solid fa-envelope"></i> Contacto</a>
  </nav>

  <div class="actions">
    <button aria-label="Carrito" id="cartButton">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- INICIO -->
<section class="page active" id="inicio">
  <main class="hero">
    <section class="content">
      <h1>Bienvenido a <span>Cisama</span></h1>

      <p class="description">
        Formando estudiantes con Valores, Conocimientos y un futuro lleno de oportunidades.
      </p>

      <div class="buttons">
        <button class="primary" onclick="cambiarPagina('tienda')">
          EXPLORAR TIENDA <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </button>
        <button class="secondary" onclick="cambiarPagina('tienda')">
          VER MÁS <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </section>

    <div class="product">
      <img src="templates/assets/camisa.png" alt="Camisa liceo">
    </div>
  </main>
</section>

<!-- TIENDA -->
<section class="page" id="tienda">
  <main class="store">

    <div class="store-head">
      <div class="store-heading">
        <h2>Cisama <span>Tienda</span></h2>
        <p>Encuentra los productos disponibles de Cisama.</p>
      </div>

      <div class="store-tools">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="productSearch" placeholder="Buscar productos...">
        </div>

        <select id="categoryFilter">
          <option value="">Todas las categorías</option>
        </select>
      </div>
    </div>

    <div class="products-grid" id="productsGrid">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Cargando productos...</p>
      </div>
    </div>

  </main>
</section>

<div class="toast" id="toast">
  <i class="fa-solid fa-circle-check"></i>
  Producto agregado al carrito
</div>

<script>

// CONFIGURACIÓN API
const API_URL = "https://api-chicken-runner.monitorealo.online/api/productos";
const API_ORIGIN = new URL(API_URL).origin;

// ESTADO
let productos = [];
let carrito = [];
let productosCargados = false;
let cargandoProductos = false;

// NAVEGACIÓN
function cambiarPagina(nombre){

  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav a[data-page]').forEach(a=>a.classList.remove('active'));

  document.getElementById(nombre).classList.add('active');

  const link=document.querySelector(`nav a[data-page="${nombre}"]`);
  if(link)link.classList.add('active');

  if(nombre==='tienda' && !productosCargados && !cargandoProductos){
    cargarProductos();
  }

  window.scrollTo({top:0,behavior:'smooth'});
}

document.querySelectorAll('nav a[data-page]').forEach(link=>{
  link.addEventListener('click',()=>{
    cambiarPagina(link.dataset.page);
  });
});

// CARRITO
document.getElementById('cartButton').addEventListener('click',()=>{

  if(carrito.length===0){
    mostrarToast('Tu carrito está vacío');
    return;
  }

  const total=carrito.reduce((s,p)=>s+(p.price*p.quantity),0);
  const detalle=carrito.map(p=>`${p.name} x${p.quantity}`).join('\n');

  alert(`TU CARRITO\n\n${detalle}\n\nTotal: RD$ ${total.toFixed(2)}`);
});

function agregarCarrito(id){

  const producto=productos.find(p=>String(p.id)===String(id));
  if(!producto)return;

  if(producto.stock<=0){
    mostrarToast('Producto agotado');
    return;
  }

  const existente=carrito.find(p=>String(p.id)===String(id));

  if(existente){

    if(existente.quantity>=producto.stock){
      mostrarToast('No hay más unidades disponibles');
      return;
    }

    existente.quantity++;

  }else{
    carrito.push({...producto,quantity:1});
  }

  actualizarCarrito();
  mostrarToast('Producto agregado al carrito');
}

function actualizarCarrito(){

  const cantidad=carrito.reduce((s,p)=>s+p.quantity,0);

  document.getElementById('cartCount').textContent=cantidad;
}

// NOTIFICACIONES
let toastTimer;

function mostrarToast(mensaje){

  const toast=document.getElementById('toast');

  toast.innerHTML=`<i class="fa-solid fa-circle-check"></i> ${mensaje}`;

  toast.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove('show');
  },2500);
}

// CARGAR PRODUCTOS DESDE FLASK
async function cargarProductos(){

  if(cargandoProductos)return;

  cargandoProductos=true;

  const grid=document.getElementById('productsGrid');

  grid.innerHTML=`
    <div class="loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p>Conectando con el servidor...</p>
    </div>
  `;

  try{

    const respuesta=await fetch(API_URL,{
      method:"GET",
      headers:{
        "Accept":"application/json"
      }
    });

    if(!respuesta.ok){
      throw new Error('Error HTTP '+respuesta.status);
    }

    const data=await respuesta.json();

    if(!data || !Array.isArray(data.productos)){
      throw new Error('La respuesta no contiene un arreglo de productos');
    }

    productos=data.productos.map(p=>({

      id:p.id,

      name:String(p.name || ''),

      description:String(p.description || ''),

      price:Number(p.price),

      image:p.image
        ? new URL(p.image,API_ORIGIN+'/').href
        : '',

      category:String(p.category || 'General'),

      stock:Number(p.stock ?? 0)

    })).filter(p=>
      p.id!==undefined &&
      p.name.length>0 &&
      Number.isFinite(p.price) &&
      Number.isFinite(p.stock)
    );

    cargarCategorias();

    mostrarProductos();

    productosCargados=true;

    console.log('Productos recibidos:',productos);

  }catch(error){

    console.error('Error cargando productos:',error);

    grid.innerHTML=`
      <div class="error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h3>No se pudieron cargar los productos</h3>
        <p style="margin-top:10px">${error.message}</p>

        <button class="primary" style="margin-top:20px" onclick="cargarProductos()">
          <i class="fa-solid fa-rotate"></i> Reintentar
        </button>
      </div>
    `;

  }finally{

    cargandoProductos=false;

  }
}

// CATEGORÍAS
function cargarCategorias(){

  const select=document.getElementById('categoryFilter');

  const seleccion=select.value;

  const categorias=[...new Set(productos.map(p=>p.category))];

  select.innerHTML='<option value="">Todas las categorías</option>';

  categorias.forEach(categoria=>{

    const option=document.createElement('option');

    option.value=categoria;
    option.textContent=categoria;

    select.appendChild(option);

  });

  select.value=seleccion;
}

// MOSTRAR PRODUCTOS
function mostrarProductos(){

  const grid=document.getElementById('productsGrid');

  const busqueda=document.getElementById('productSearch').value.toLowerCase();

  const categoria=document.getElementById('categoryFilter').value;

  const filtrados=productos.filter(p=>
    (p.name.toLowerCase().includes(busqueda) ||
     p.description.toLowerCase().includes(busqueda)) &&
    (!categoria || p.category===categoria)
  );

  grid.innerHTML='';

  if(filtrados.length===0){

    grid.innerHTML=`
      <div class="empty">
        <i class="fa-solid fa-box-open"></i>
        <h3>No encontramos productos</h3>
        <p style="margin-top:10px">Intenta con otra búsqueda o categoría.</p>
      </div>
    `;

    return;
  }

  filtrados.forEach(p=>{

    const card=document.createElement('article');
    card.className='product-card';

    const imagen=document.createElement('div');
    imagen.className='product-image';

    const img=document.createElement('img');
    img.src=p.image;
    img.alt=p.name;
    img.loading='lazy';

    img.onerror=()=>{
      img.style.display='none';
    };

    imagen.appendChild(img);

    const info=document.createElement('div');
    info.className='product-info';

    const titulo=document.createElement('h3');
    titulo.textContent=p.name;

    const descripcion=document.createElement('p');
    descripcion.className='product-description';
    descripcion.textContent=p.description;

    const footer=document.createElement('div');
    footer.className='product-footer';

    const precio=document.createElement('span');
    precio.className='product-price';

    const iconoPrecio=document.createElement('i');
    iconoPrecio.className='fa-solid fa-tag';

    const precioTexto=document.createElement('span');
    precioTexto.textContent='RD$ '+p.price.toLocaleString('es-DO',{
      minimumFractionDigits:2
    });

    precio.append(iconoPrecio,precioTexto);

    const boton=document.createElement('button');
    boton.className='add-cart';
    boton.innerHTML='<i class="fa-solid fa-cart-plus"></i>';
    boton.title='Agregar al carrito';
    boton.setAttribute('aria-label','Agregar '+p.name+' al carrito');
    boton.disabled=p.stock<=0;

    boton.addEventListener('click',()=>{
      agregarCarrito(p.id);
    });

    footer.append(precio,boton);

    const cantidad=document.createElement('div');
    cantidad.className='product-quantity'+(p.stock<=0?' out':'');

    const iconoCantidad=document.createElement('i');
    iconoCantidad.className='fa-solid fa-boxes-stacked';

    const etiquetaCantidad=document.createElement('span');
    etiquetaCantidad.textContent='Cantidad:';

    const valorCantidad=document.createElement('strong');
    valorCantidad.textContent=p.stock;

    cantidad.append(iconoCantidad,etiquetaCantidad,valorCantidad);

    info.append(titulo,descripcion,footer,cantidad);

    card.append(imagen,info);

    grid.appendChild(card);

  });

}

// FILTROS
document.getElementById('productSearch').addEventListener('input',mostrarProductos);

document.getElementById('categoryFilter').addEventListener('change',mostrarProductos);

</script>

</body>
</html>
