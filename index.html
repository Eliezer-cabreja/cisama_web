<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cisama | Admin Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Arial,sans-serif;
  color:white;
  min-height:100vh;
  position:relative;
  background:#071426;
  display:flex;
  overflow-x:hidden;
}

/* Fondo con imagen, sutil */
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:url('templates/assets/fondo-admin.jpg') center/cover no-repeat;
  z-index:-2;
  filter:brightness(.25) saturate(.85);
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  background:#071426dd;
  z-index:-1;
}

/* ================= SIDEBAR ================= */
.sidebar{
  width:240px;
  min-height:100vh;
  background:#0a1626;
  border-right:1px solid #1a2c42;
  padding:22px 14px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  z-index:10;
  transition:transform .25s;
}

.sidebar-brand{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 0 20px;
  border-bottom:1px solid #142436;
  margin-bottom:20px;
}
.sidebar-brand img{
  height:54px;
  width:auto;
  max-width:180px;
  object-fit:contain;
}

.sidebar-label{
  font-size:10px;
  color:#5d728d;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  margin:0 8px 8px;
}

.sidebar-nav{
  display:flex;
  flex-direction:column;
  gap:2px;
  flex:1;
}
.nav-tab{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  border-radius:8px;
  color:#9bb0c9;
  text-decoration:none;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:.2s;
}
.nav-tab i{
  font-size:13px;
  width:16px;
  text-align:center;
}
.nav-tab:hover{
  background:#101f33;
  color:white;
}
.nav-tab.active{
  background:#16324f;
  color:white;
  border-left:2px solid #438eea;
  padding-left:10px;
}
.nav-tab.active i{color:#438eea}

/* ================= MAIN ================= */
.main{
  flex:1;
  min-height:100vh;
  padding:24px 32px 40px;
  overflow-x:hidden;
}

/* Topbar */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:28px;
  padding-bottom:20px;
  border-bottom:1px solid #1a2c42;
  flex-wrap:wrap;
  position:relative;
}
.topbar-left{
  display:flex;
  align-items:center;
  gap:14px;
}
.topbar-title h1{
  font-size:22px;
  font-weight:700;
  letter-spacing:-.3px;
}
.topbar-title h1 span{color:#438eea}
.topbar-title p{
  color:#7f93ad;
  font-size:12.5px;
  margin-top:4px;
}

.menu-toggle{
  display:none;
  background:#0d1c30;
  border:1px solid #1a2c42;
  color:white;
  width:40px;height:40px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
}

/* ================= PERFIL DROPDOWN ================= */
.profile-wrap{
  position:relative;
}
.profile-btn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 12px 6px 6px;
  background:#0d1c30;
  border:1px solid #1a2c42;
  border-radius:30px;
  cursor:pointer;
  transition:.2s;
  color:white;
  font-family:inherit;
}
.profile-btn:hover{
  background:#122439;
  border-color:#2a4a6e;
}
.profile-avatar{
  width:32px;height:32px;
  border-radius:50%;
  background:#2476d9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:13px;
  flex-shrink:0;
}
.profile-info{
  text-align:left;
  line-height:1.2;
}
.profile-name{
  font-size:12.5px;
  font-weight:600;
  color:#f1f6ff;
  max-width:120px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.profile-role{
  font-size:10.5px;
  color:#7f93ad;
}
.profile-btn .chev{
  font-size:10px;
  color:#7f93ad;
  margin-left:4px;
  transition:.2s;
}
.profile-wrap.open .profile-btn .chev{
  transform:rotate(180deg);
}

/* Dropdown */
.profile-menu{
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  background:#0d1c30;
  border:1px solid #1a2c42;
  border-radius:10px;
  min-width:200px;
  padding:6px;
  box-shadow:0 12px 30px #0008;
  opacity:0;
  visibility:hidden;
  transform:translateY(-6px);
  transition:.2s;
  z-index:50;
}
.profile-wrap.open .profile-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.profile-menu-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  border-radius:7px;
  color:#dce8f8;
  text-decoration:none;
  font-size:13px;
  cursor:pointer;
  transition:.15s;
  background:transparent;
  border:0;
  width:100%;
  text-align:left;
  font-family:inherit;
}
.profile-menu-item:hover{
  background:#16324f;
}
.profile-menu-item.danger{
  color:#ff9a9a;
}
.profile-menu-item.danger:hover{
  background:#ff4d4d18;
}
.profile-menu-item i{
  width:16px;
  text-align:center;
  font-size:12.5px;
}
.profile-menu-divider{
  height:1px;
  background:#1a2c42;
  margin:5px 0;
}

/* ================= FORMULARIO ================= */
.card{
  background:#0d1c30;
  border:1px solid #1a2c42;
  border-radius:12px;
  padding:24px 26px 26px;
  max-width:760px;
}

.card-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
  padding-bottom:16px;
  border-bottom:1px solid #142436;
}
.card-head-icon{
  width:38px;height:38px;
  border-radius:9px;
  background:#16324f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  color:#438eea;
  border:1px solid #1f3a5a;
}
.card-head h2{
  font-size:15.5px;
  font-weight:700;
  letter-spacing:-.2px;
}
.card-head p{
  font-size:11.5px;
  color:#7f93ad;
  margin-top:2px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.form-grid .full{grid-column:1/-1}

.field label{
  display:block;
  font-size:11px;
  color:#9bb0c9;
  font-weight:600;
  margin-bottom:6px;
  letter-spacing:.3px;
}
.field label .req{color:#ff8585;margin-left:2px}
.input-wrap{position:relative}
.input-wrap > i{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:#5d728d;
  font-size:12.5px;
  pointer-events:none;
  transition:color .2s;
}
.input-wrap textarea + i{
  top:14px;
  transform:none;
}
.input-wrap input,
.input-wrap textarea,
.input-wrap select{
  width:100%;
  background:#071426;
  border:1px solid #1a2c42;
  border-radius:8px;
  color:white;
  padding:11px 13px 11px 38px;
  outline:none;
  font-size:13px;
  font-family:inherit;
  transition:.2s;
}
.input-wrap input,
.input-wrap select{height:42px}
.input-wrap textarea{
  min-height:88px;
  resize:vertical;
  line-height:1.5;
}
.input-wrap input::placeholder,
.input-wrap textarea::placeholder{color:#4f6580}
.input-wrap input:focus,
.input-wrap textarea:focus,
.input-wrap select:focus{
  border-color:#438eea;
  background:#0b1b30;
}
.input-wrap input:focus ~ i,
.input-wrap textarea:focus ~ i,
.input-wrap:focus-within > i{color:#438eea}

.input-wrap select{
  padding-right:32px;
  appearance:none;
  -webkit-appearance:none;
  cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%235d728d' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;
  background-position:right 12px center;
}
.input-wrap select option{background:#0b1b30;color:#dce8f8}

/* ================= BOTÓN DE SUBIR IMAGEN ================= */
.file-btn-wrap{
  display:inline-block;
}
.file-btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  height:44px;
  padding:0 20px;
  background:linear-gradient(135deg, #1f3a5a, #0d1c30);
  border:1px dashed #438eea;
  border-radius:8px;
  color:#8dc2ff;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .25s ease;
  box-shadow: 0 4px 10px #0003;
}
.file-btn:hover{
  background:linear-gradient(135deg, #2476d9, #16324f);
  border-color:#438eea;
  color:white;
  transform: translateY(-2px);
  box-shadow: 0 6px 15px #2476d966;
}
.file-btn i{ font-size:16px; }
.file-btn input{ display:none; }

/* Cuando ya hay imagen seleccionada */
.file-btn.has-file{
  background:#16324f;
  border-style:solid;
  border-color:#65cf9a;
  color:#8be4b5;
}
.file-btn.has-file i{ color:#65cf9a; }

.file-preview{
  display:none;
  margin-top:12px;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #1a2c42;
  max-width:160px;
}
.file-preview img{
  width:100%;
  display:block;
}

/* Botón único */
.form-actions{
  display:flex;
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid #142436;
}
.btn{
  height:42px;
  padding:0 20px;
  border:0;
  border-radius:8px;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:.2s;
  font-family:inherit;
}
.btn-primary{
  background:#2476d9;
  color:white;
}
.btn-primary:hover:not(:disabled){
  background:#2f8bf0;
}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}

/* Mensaje */
.msg{
  display:none;
  margin-top:16px;
  font-size:12.5px;
  align-items:center;
  gap:9px;
}
.msg.show{display:flex}
.msg.error{
  padding:11px 13px;
  border-radius:8px;
  background:#ff4d4d18;
  border:1px solid #ff4d4d55;
  color:#ff9a9a;
}
.msg.success{
  color:#65cf9a;
  font-weight:600;
}

/* Overlay */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:5;
}
.overlay.show{display:block}

/* ================= RESPONSIVE (CELULAR) ================= */
@media(max-width:900px){
  .sidebar{
    position:fixed;
    left:0;top:0;
    transform:translateX(-100%);
    box-shadow:8px 0 30px #0009;
  }
  .sidebar.open{transform:translateX(0)}
  
  .main{ padding:16px 16px 32px; }
  .menu-toggle{ display:flex; align-items:center; justify-content:center; }
  
  .topbar { gap: 10px; margin-bottom: 20px; padding-bottom: 16px; }
  .topbar-title h1 { font-size: 18px; }
  .topbar-title p { font-size: 11.5px; }
  
  /* El perfil se queda visible pero compacto */
  .profile-info { display: none; }
  .profile-btn { padding: 4px 8px 4px 4px; }
  .profile-btn .chev { margin-left: 0; }
  .profile-menu { right: 0; top: calc(100% + 6px); }
  
  .card{ padding:18px 16px 20px; border-radius:10px; }
  .card-head h2 { font-size: 15px; }
  .card-head p { font-size: 11px; }
  
  .form-grid{ grid-template-columns:1fr; gap:12px; }
  
  /* Evitar que el teclado del celular haga zoom (fuente mínimo 16px) */
  .input-wrap input,
  .input-wrap textarea,
  .input-wrap select {
    font-size: 16px; 
    height: 46px;
    padding: 10px 12px 10px 36px;
  }
  .input-wrap textarea { height: auto; min-height: 80px; }
  .input-wrap i { font-size: 13px; left: 12px; }
  
  .file-btn { width: 100%; justify-content: center; }
  .file-preview { max-width: 100%; }
  
  .form-actions { flex-direction: column; }
  .btn { width: 100%; justify-content: center; height: 46px; font-size: 14px; }
}

@media(max-width:430px){
  .main{ padding:14px 12px 28px; }
  .card { padding:16px 12px 18px; }
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img src="templates/assets/logo.png" alt="Cisama">
  </div>
  <div class="sidebar-label">Menú</div>
  <nav class="sidebar-nav">
    <a class="nav-tab active" data-tab="agregar">
      <i class="fa-solid fa-plus"></i>
      Agregar Productos
    </a>
  </nav>
</aside>

<!-- ================= MAIN ================= -->
<main class="main">

  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menuToggle" aria-label="Menú">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="topbar-title">
        <h1>Agregar <span>Producto</span></h1>
        <p>Añade nuevos productos a la tienda de Cisama</p>
      </div>
    </div>

    <!-- PERFIL ARRIBA A LA DERECHA -->
    <div class="profile-wrap" id="profileWrap">
      <button class="profile-btn" id="profileBtn">
        <div class="profile-avatar" id="userAvatar">A</div>
        <div class="profile-info">
          <div class="profile-name" id="userName">Admin</div>
          <div class="profile-role">Administrador</div>
        </div>
        <i class="fa-solid fa-chevron-down chev"></i>
      </button>

      <div class="profile-menu">
        <button class="profile-menu-item" onclick="alert('Próximamente: Mi perfil')">
          <i class="fa-solid fa-user"></i> Mi perfil
        </button>
        <div class="profile-menu-divider"></div>
        <button class="profile-menu-item danger" id="btnLogout">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-head-icon">
        <i class="fa-solid fa-box-open"></i>
      </div>
      <div>
        <h2>Nuevo Producto</h2>
        <p>Completa los datos para publicarlo en la tienda</p>
      </div>
    </div>

    <form id="productForm" autocomplete="off">
      <div class="form-grid">
        <div class="field full">
          <label for="name">Nombre del producto <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="text" id="name" placeholder="Ej: Camisa oficial del liceo" required>
            <i class="fa-solid fa-tag"></i>
          </div>
        </div>

        <div class="field full">
          <label for="description">Descripción <span class="req">*</span></label>
          <div class="input-wrap">
            <textarea id="description" placeholder="Describe el producto brevemente..." required></textarea>
            <i class="fa-solid fa-align-left"></i>
          </div>
        </div>

        <div class="field">
          <label for="price">Precio (RD$) <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="number" id="price" placeholder="0.00" step="0.01" min="0" required>
            <i class="fa-solid fa-dollar-sign"></i>
          </div>
        </div>

        <div class="field">
          <label for="stock">Stock disponible <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="number" id="stock" placeholder="0" min="0" step="1" required>
            <i class="fa-solid fa-boxes-stacked"></i>
          </div>
        </div>

        <div class="field full">
          <label for="category">Categoría <span class="req">*</span></label>
          <div class="input-wrap">
            <select id="category" required>
              <option value="">Selecciona una categoría</option>
              <option value="Uniformes">Uniformes</option>
              <option value="Camisas">Camisas</option>
              <option value="Pantalones">Pantalones</option>
              <option value="Accesorios">Accesorios</option>
              <option value="Calzado">Calzado</option>
              <option value="Otros">Otros</option>
            </select>
            <i class="fa-solid fa-layer-group"></i>
          </div>
        </div>

        <div class="field full">
          <label>Imagen del producto</label>
          <div class="file-btn-wrap">
            <label class="file-btn" id="fileBtnLabel">
              <input type="file" id="image" accept="image/*">
              <i class="fa-solid fa-folder-open" id="fileIcon"></i>
              <span id="fileText">Seleccionar Imagen</span>
            </label>
          </div>
          
          <div class="file-preview" id="filePreview">
            <img id="previewImg" src="" alt="Preview">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="btnSubmit">
          <i class="fa-solid fa-plus"></i> Agregar Producto
        </button>
      </div>

      <div class="msg" id="msg"></div>
    </form>
  </div>
</main>

<script>
const LOGIN_URL = "login.html";
const API_PRODUCTOS = "https://api-chicken-runner.monitorealo.online/api/productos";

const token = localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
const adminName = localStorage.getItem('adminName') || sessionStorage.getItem('adminName') || 'Admin';

if(!token){
  window.location.href = LOGIN_URL;
}

document.getElementById('userName').textContent = adminName;
document.getElementById('userAvatar').textContent = (adminName[0] || 'A').toUpperCase();

const profileWrap = document.getElementById('profileWrap');
const profileBtn = document.getElementById('profileBtn');

profileBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  profileWrap.classList.toggle('open');
});

document.addEventListener('click', (e) => {
  if(!profileWrap.contains(e.target)){
    profileWrap.classList.remove('open');
  }
});

document.getElementById('btnLogout').addEventListener('click', () => {
  localStorage.removeItem('adminToken');
  localStorage.removeItem('adminName');
  sessionStorage.removeItem('adminToken');
  sessionStorage.removeItem('adminName');
  window.location.href = LOGIN_URL;
});

const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const menuToggle = document.getElementById('menuToggle');

menuToggle.addEventListener('click', () => {
  sidebar.classList.add('open');
  overlay.classList.add('show');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
});

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

const imageInput = document.getElementById('image');
const fileText = document.getElementById('fileText');
const fileBtnLabel = document.getElementById('fileBtnLabel');
const fileIcon = document.getElementById('fileIcon');
const filePreview = document.getElementById('filePreview');
const previewImg = document.getElementById('previewImg');

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if(!file){
    fileText.textContent = 'Seleccionar Imagen';
    fileIcon.className = 'fa-solid fa-folder-open';
    fileBtnLabel.classList.remove('has-file');
    filePreview.style.display = 'none';
    return;
  }
  
  fileText.textContent = file.name;
  fileIcon.className = 'fa-solid fa-check-circle';
  fileBtnLabel.classList.add('has-file');

  const reader = new FileReader();
  reader.onload = (e) => {
    previewImg.src = e.target.result;
    filePreview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

const msg = document.getElementById('msg');
function mostrarMsg(texto, tipo){
  msg.className = 'msg show ' + tipo;
  msg.innerHTML = `<i class="fa-solid ${tipo==='error'?'fa-circle-exclamation':'fa-circle-check'}"></i><span>${texto}</span>`;
}
function ocultarMsg(){
  msg.className = 'msg';
  msg.innerHTML = '';
}

const form = document.getElementById('productForm');
const btnSubmit = document.getElementById('btnSubmit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  ocultarMsg();

  const name = document.getElementById('name').value.trim();
  const description = document.getElementById('description').value.trim();
  const price = parseFloat(document.getElementById('price').value);
  const stock = parseInt(document.getElementById('stock').value);
  const category = document.getElementById('category').value;
  const imageFile = imageInput.files[0];

  if(!name || !description || !category){
    mostrarMsg('Completa todos los campos obligatorios', 'error');
    return;
  }
  if(!Number.isFinite(price) || price < 0){
    mostrarMsg('El precio debe ser un número válido', 'error');
    return;
  }
  if(!Number.isFinite(stock) || stock < 0){
    mostrarMsg('El stock debe ser un número válido', 'error');
    return;
  }

  btnSubmit.disabled = true;
  btnSubmit.innerHTML = '<span>Guardando...</span><i class="fa-solid fa-spinner fa-spin"></i>';

  try {
    const formData = new FormData();
    formData.append('name', name);
    formData.append('description', description);
    formData.append('price', price);
    formData.append('stock', stock);
    formData.append('category', category);
    if(imageFile){
      formData.append('image', imageFile);
    }

    const res = await fetch(API_PRODUCTOS, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: formData
    });

    let data;
    try { data = await res.json(); }
    catch { throw new Error('Respuesta inválida del servidor'); }

    if(!res.ok || data.status === false){
      throw new Error(data.mensaje || 'No se pudo agregar el producto');
    }

    mostrarMsg(data.mensaje || '¡Producto agregado con éxito!', 'success');

    form.reset();
    fileText.textContent = 'Seleccionar Imagen';
    fileIcon.className = 'fa-solid fa-folder-open';
    fileBtnLabel.classList.remove('has-file');
    filePreview.style.display = 'none';

  } catch (err) {
    console.error('Error al agregar producto:', err);
    mostrarMsg(err.message || 'Error al guardar el producto', 'error');
  } finally {
    btnSubmit.disabled = false;
    btnSubmit.innerHTML = '<i class="fa-solid fa-plus"></i> Agregar Producto';
  }
});
</script>

</body>
</html>
